# Собирает прошивку при каждом изменении исходников и кладёт её в firmware/.
# Гаджет находит её сам: Настройки -> Обновление -> Проверить в интернете.
name: Build firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - 'firmware/**'
      - '**.md'
      - 'room.html'
      - 'ble.html'
      - 'pc.html'
      - 'hardware/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  # OTA выпускается только для полных сборок ESP32-C3 и ESP32-S3.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [c3, s3]
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library" "Adafruit GFX Library" "ArduinoJson" "TJpg_Decoder" "NimBLE-Arduino@1.4.3"

      - name: Build
        run: |
          VER=$((100 + GITHUB_RUN_NUMBER))
          if [ "${{ matrix.board }}" = "c3" ]; then
            FQBN="esp32:esp32:nologo_esp32c3_super_mini:CDCOnBoot=cdc,PartitionScheme=huge_app"
            NAME="firmware"
          else
            FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=enabled,FlashSize=4M,PartitionScheme=huge_app"
            NAME="firmware-s3"
          fi
          FLAGS="-DFW_VERSION=$VER"
          arduino-cli compile --fqbn "$FQBN" --build-property "compiler.cpp.extra_flags=$FLAGS" --output-dir out deepseek_c3
          # Разметка из partitions.csv: под прошивку 0x1E0000 байт
          SZ=$(stat -c %s out/deepseek_c3.ino.bin); echo "$NAME: $SZ of 1966080"
          if [ "$SZ" -gt 1966080 ]; then echo "::error::$NAME does not fit"; exit 1; fi
          mkdir -p bin && cp out/deepseek_c3.ino.bin "bin/$NAME.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.board }}-full
          path: bin/*.bin

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true

      - name: Publish firmware
        run: |
          VER=$((100 + GITHUB_RUN_NUMBER))
          ls -la bins
          # не собралась хоть одна сборка - не публикуем ничего (иначе гаджеты одной из плат останутся без обновления)
          for n in firmware firmware-s3; do
            [ -f "bins/$n.bin" ] || { echo "::error::$n.bin missing"; exit 1; }
          done
          mkdir -p firmware
          for n in firmware firmware-s3; do
            cp "bins/$n.bin" "firmware/$n.bin"
          done
          echo "$VER" > firmware/version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/firmware.bin firmware/firmware-s3.bin firmware/version.txt
          git commit -m "Firmware build $VER [skip ci]"
          git pull --rebase
          git push
